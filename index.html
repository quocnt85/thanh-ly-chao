<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalog Đặt Hàng Nhanh - Thanh Lý Gia Dụng Ý (TVS &amp; Borgonovo)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Sticky Header -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-block">
        <div class="brand-badge" aria-hidden="true">IT</div>
        <div>
          <h1 class="brand-title">Thanh Lý Gia Dụng Ý (TVS &amp; Borgonovo)</h1>
          <p class="brand-subtitle">Hàng chính hãng Italy • Giá thanh lý dọn kho (chưa gồm VAT &amp; vận chuyển)</p>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" class="btn btn-outline" id="open-cart-header-btn">
          <span>🛒 Giỏ hàng</span>
          <span class="cart-count-pill" id="header-cart-count">0</span>
          <span id="header-cart-total">0 ₫</span>
        </button>
        <button type="button" class="btn btn-success" id="quick-export-header-btn">
          📥 Xuất Excel
        </button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <!-- Search, Filter & Promo Code Toolbar -->
    <section class="catalog-toolbar" aria-label="Bộ lọc và tìm kiếm sản phẩm">
      <div class="toolbar-top">
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">🔎</span>
          <input
            type="search"
            id="search-input"
            name="q"
            placeholder="Tìm tên, mã (#1, #25), kích thước (ø20cm)..."
            aria-label="Tìm kiếm sản phẩm"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
          />
        </div>

        <select id="series-filter" class="filter-select" aria-label="Lọc theo dòng sản phẩm">
          <option value="ALL">Tất cả dòng</option>
        </select>

        <select id="sort-select" class="filter-select" aria-label="Sắp xếp sản phẩm">
          <option value="code-asc">Mã: Tăng dần</option>
          <option value="price-asc">Giá: Thấp → Cao</option>
          <option value="price-desc">Giá: Cao → Thấp</option>
          <option value="stock-desc">Tồn: Nhiều → Ít</option>
        </select>

        <button type="button" class="btn btn-outline" id="toggle-only-cart-btn" aria-pressed="false">
          Đã chọn (0)
        </button>

        <form id="promo-form" class="promo-form" action="#" method="GET" novalidate>
          <label for="promo-code-input" class="promo-label">🏷️ Mã giảm:</label>
          <input
            type="text"
            id="promo-code-input"
            name="promoCode"
            placeholder="Nhập mã..."
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="done"
            aria-describedby="promo-status"
          />
          <button type="submit" class="btn btn-primary btn-sm" id="promo-submit-btn">Áp dụng</button>
          <button type="button" class="btn btn-ghost btn-sm" id="promo-clear-btn" hidden aria-label="Xóa mã giảm giá">✕</button>
          <span id="promo-status" class="promo-status" role="status" aria-live="polite"></span>
        </form>
      </div>

      <div class="category-tabs-row">
        <div class="category-tabs" id="category-tabs" role="toolbar" aria-label="Danh mục mặt hàng"></div>
        <span id="showing-count" class="showing-count"></span>
      </div>
    </section>

    <!-- Product Grid -->
    <section id="catalog-grid" class="catalog-grid" aria-label="Danh sách sản phẩm thanh lý"></section>
  </main>

  <!-- Sticky Bottom Bar when items are in Cart -->
  <aside id="sticky-cart-bar" class="sticky-cart-bar" hidden aria-label="Tóm tắt đơn hàng đang chọn">
    <div class="sticky-cart-inner">
      <div class="sticky-summary">
        <span>Đã chọn: <strong id="sticky-cart-types">0</strong> mã (<strong id="sticky-cart-units">0</strong> SP)</span>
        <span>Tổng: <span class="sticky-total-price" id="sticky-cart-price">0 ₫</span> <small id="sticky-promo-note">(Chưa VAT &amp; VC)</small></span>
      </div>
      <div class="sticky-actions">
        <button type="button" class="btn btn-outline" id="open-cart-sticky-btn">
          🛒 Giỏ hàng
        </button>
        <button type="button" class="btn btn-success" id="quick-export-sticky-btn">
          📥 Xuất Excel
        </button>
      </div>
    </div>
  </aside>

  <!-- Cart & Excel Export Modal Dialog (modern-web-guidance: dialog & light-dismiss-a-dialog) -->
  <!-- MANDATORY: no role="dialog" or aria-modal; native <dialog> opened with showModal() provides them -->
  <dialog id="cart-dialog" class="modal-dialog" closedby="any" aria-labelledby="cart-dialog-title">
    <div class="dialog-header">
      <h2 id="cart-dialog-title">🛒 Giỏ Đặt Hàng</h2>
      <form method="dialog">
        <button type="submit" class="btn btn-ghost" aria-label="Đóng hộp thoại">✕ Đóng</button>
      </form>
    </div>

    <div class="dialog-body">
      <div class="buyer-form-grid">
        <div class="form-field">
          <label for="buyer-name">Khách hàng / Đại lý</label>
          <input type="text" id="buyer-name" name="buyerName" autocomplete="name" placeholder="Tên khách hàng / đại lý" autofocus />
        </div>
        <div class="form-field">
          <label for="buyer-phone">Số điện thoại</label>
          <input type="tel" id="buyer-phone" name="buyerPhone" autocomplete="tel" placeholder="0901 234 567" />
        </div>
        <div class="form-field">
          <label for="buyer-note">Ghi chú</label>
          <input type="text" id="buyer-note" name="buyerNote" placeholder="Giao hàng, xuất kho..." />
        </div>
        <form id="modal-promo-form" class="form-field" action="#" method="GET" novalidate>
          <label for="modal-promo-input">Mã giảm giá</label>
          <div class="modal-promo-row">
            <input
              type="text"
              id="modal-promo-input"
              name="promoCode"
              placeholder="Nhập mã..."
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              enterkeyhint="done"
            />
            <button type="submit" class="btn btn-primary btn-sm">Áp dụng</button>
          </div>
        </form>
      </div>

      <div id="cart-items-container"></div>
    </div>

    <div class="dialog-footer">
      <div id="cart-modal-summary">Tổng cộng: <strong>0 ₫</strong></div>
      <div class="header-actions">
        <button type="button" class="btn btn-outline" id="modal-clear-cart-btn">🗑️ Xóa giỏ</button>
        <button type="button" class="btn btn-outline" id="modal-copy-order-btn">📋 Copy (Zalo)</button>
        <button type="button" class="btn btn-success" id="modal-export-xlsx-btn">📥 Xuất Excel (.xlsx)</button>
      </div>
    </div>
  </dialog>

  <!-- Image Lightbox Modal Dialog -->
  <dialog id="lightbox-dialog" class="modal-dialog lightbox-dialog" closedby="any" aria-labelledby="lightbox-title">
    <div class="dialog-header">
      <h2 id="lightbox-title">Chi tiết hình ảnh sản phẩm</h2>
      <form method="dialog">
        <button type="submit" class="btn btn-ghost" autofocus>✕ Đóng</button>
      </form>
    </div>
    <div class="dialog-body">
      <img id="lightbox-img" class="lightbox-img" src="" alt="" />
      <p id="lightbox-meta" style="margin:0;font-size:0.9rem;color:var(--text-secondary);font-weight:600"></p>
      <div id="lightbox-photo-switch" class="header-actions"></div>
    </div>
  </dialog>

  <!-- Toast feedback -->
  <div id="toast-msg" class="toast-msg" role="status" aria-live="polite" hidden></div>

  <script src="products-data.js"></script>
  <script src="xlsx-export.js"></script>
  <script src="app.js"></script>
</body>
</html>
